# إعداد النشر على Render (render.com): New > Blueprint > اختار المستودع ده
services:
  - type: web
    name: tagseed
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true  # Render بيولّد مفتاح عشوائي
      - key: GEMINI_API_KEY
        sync: false  # بتكتبه بنفسك في Render وقت الإعداد، ومش بيتحفظ في المستودع
      - key: POLLINATIONS_TOKEN
        sync: false
      - key: MODEL_FAST
        value: gemini-3.5-flash-lite
      - key: MODEL_BALANCED
        value: gemini-3-flash-preview
      - key: MODEL_STRONG
        value: gemini-3-flash-preview
